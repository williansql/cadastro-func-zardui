<div class="cadastro-container flex flex-col gap-3 min-w-[335px] max-w-[50%]" [formGroup]="cadastroFuncForm" (ngSubmit)="onSubmit()" >

  <div class="title my-5" >
    <h1 class="text-4xl" >Cadastro dos dados</h1>
    <h2 class="text-md text-[#2e5992]" >Cadastro dos dados</h2>
  </div>

  <z-form-control class="form-group flex flex-col" [errorMessage]="isFieldInvalid('nome') ? 'O nome é obrigatório' : ''" >
    <label z-form-label zRequired class="text-[#2e5992]" zTooltip="é o seu nome, ex: willians" for="nome">Nome</label>
    <input id="nome" z-input placeholder="Insira o seu nome" formControlName="nome" />
  </z-form-control>
  <z-form-control class="form-group flex flex-col" [errorMessage]="isFieldInvalid('sobrenome') ? 'O sobrenome é obrigatório' : ''">
    <label z-form-label zRequired class="text-[#2e5992]" for="sobrenome" zTooltip="é o seu sobrenome, ex: Queiroz Lisardo">Sobrenome</label>
    <input id="sobrenome" z-input placeholder="Insira o seu sobrenome" formControlName="sobrenome" />
  </z-form-control>
  <z-form-control class="form-group flex flex-col" [errorMessage]="isFieldInvalid('email') ? 'O email é obrigatório' : ''">
    <label z-form-label zRequired class="text-[#2e5992]" zTooltip="ex: willians.teste@gmail.com" for="email">Email</label>
    <input id="email" z-input placeholder="Insira o seu email" formControlName="email" />
  </z-form-control>
  <z-form-control class="form-group flex flex-col" [errorMessage]="isFieldInvalid('registro') ? 'O registro é obrigatório' : ''">
    <label z-form-label zRequired class="text-[#2e5992]" for="registro" zTooltip="ex: 55487">Registro</label>
    <input id="registro" z-input placeholder="Insira o seu Registro" formControlName="registro" />
  </z-form-control>
  <z-form-control class="form-group flex flex-col" [errorMessage]="isFieldInvalid('endereco') ? 'O endereço é obrigatório' : ''">
    <label z-form-label zRequired class="text-[#2e5992]" for="endereco" zTooltip="exemplo: Rua do teste, 50, Santa teresa, Parnamirim/RN" >Endereço</label>
    <input id="endereco" z-input placeholder="Insira o seu Endereço" formControlName="endereco" />
  </z-form-control>
  <z-form-control class="form-group flex flex-col" [errorMessage]="isFieldInvalid('setor') ? 'O setor é obrigatório' : ''" >
    <label z-form-label zRequired class="text-[#2e5992]" for="setor" zTooltip="secretaria/setor ao qual esta lotado, ex: GACIV-GCTI-Desenvolvimento" >Setor</label>
    <input id="setor" z-input placeholder="Insira o nome do setor" formControlName="setor" />
  </z-form-control>

  <div class="button flex mt-5 gap-5">
    <button z-button zType="default" zSize="default" class="grow" (click)="onSubmit()" >Salvar</button>
    <button z-button zType="outline" zSize="default" class="grow" (click)="clearForm()" >Limpar</button>
  </div>

</div>

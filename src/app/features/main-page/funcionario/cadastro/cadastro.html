<div class="cadastro-container flex flex-col max-w-[50%] gap-3" [formGroup]="cadastroFuncForm" (ngSubmit)="onSubmit()" >

  <div class="title my-5" >
    <h1 class="text-4xl" >Cadastro dos dados</h1>
    <h2 class="text-md text-[#2e5992]" >Cadastro dos dados</h2>
  </div>

  <div class="form-group flex flex-col">
    <label class="text-[#2e5992]" for="nome">Nome</label>
    <input id="nome" z-input placeholder="Insira o seu nome" formControlName="nome" />
  </div>
  <div class="form-group flex flex-col">
    <label class="text-[#2e5992]" for="sobrenome">Sobrenome</label>
    <input id="sobrenome" z-input placeholder="Insira o seu sobrenome" formControlName="sobrenome" />
  </div>
  <div class="form-group flex flex-col">
    <label class="text-[#2e5992]" for="email">Email</label>
    <input id="email" z-input placeholder="Insira o seu email" formControlName="email" />
  </div>
  <div class="form-group flex flex-col">
    <label class="text-[#2e5992]" for="registro">Registro</label>
    <input id="registro" z-input placeholder="Insira o seu Registro" formControlName="registro" />
  </div>
  <div class="form-group flex flex-col">
    <label class="text-[#2e5992]" for="setor">Setor</label>
    <input id="setor" z-input placeholder="Insira o nome do setor" formControlName="setor" />
  </div>

  <div class="button flex mt-5 gap-5">
    <button z-button zType="default" zSize="default" class="grow" (click)="onSubmit()" >Salvar</button>
    <button z-button zType="outline" zSize="default" class="grow" (click)="clearForm()" >Limpar</button>
  </div>

</div>
